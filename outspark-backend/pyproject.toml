[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "outspark-backend"
version = "0.2.0"
description = "Outspark modular serverless backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3==1.42.97",
    "fastapi==0.143.0",
    "mangum==0.22.0",
    "psycopg[binary]==3.3.9",
    "psycopg-pool==3.3.3",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "ruff==0.17.0"]

[tool.setuptools.packages.find]
include = ["outspark*"]

[tool.setuptools.package-data]
"outspark.shared.infrastructure.dynamodb" = ["table.json", "base-table.json"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["dynamodb", "backend"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
